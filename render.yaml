services:
  - type: web
    name: stockyard-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Set to the deployed frontend URL in the Render dashboard.
      # Accepts a comma-separated list for multiple origins.
      - key: CORS_ORIGIN
        sync: false
